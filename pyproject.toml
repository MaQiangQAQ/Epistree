[project]
name = "epistree-demo"
version = "0.3.0"
description = "Epistree — 可回溯来源的知识世界树 Demo"
requires-python = ">=3.14"
dependencies = [
    "dash[diskcache]>=4.4,<5",
    "dash-cytoscape>=1.0,<2",
    "requests-cache>=1.3,<2",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2,<3",
    "instructor[openai]>=1.16,<2",
    "tenacity>=9.1,<10",
    "gunicorn>=26.2,<27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epistree_demo"]

[project.scripts]
epistree-demo = "epistree_demo.app:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "responses",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "responses>=0.26.3",
    "ruff>=0.16.6",
]
